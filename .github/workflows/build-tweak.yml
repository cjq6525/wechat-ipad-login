name: Build WeChat iPad Login Tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}
          restore-keys: theos-${{ runner.os }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync curl perl unzip

      - name: Install Theos
        run: |
          if [ ! -d "theos" ]; then
            git clone --recursive https://github.com/theos/theos.git theos
          fi
          echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -L https://github.com/theos/sdks/archive/refs/heads/main.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          cp -r /tmp/sdks/sdks-main/* $THEOS/sdks/
          ls $THEOS/sdks/

      - name: Build package
        run: |
          cd wechat-ipad-login
          make clean || true
          make package FINAL=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChatIPadLogin-deb
          path: wechat-ipad-login/packages/*.deb
