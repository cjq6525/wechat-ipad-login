name: Build WeChat iPad Login Tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}
          restore-keys: theos-${{ runner.os }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync curl perl unzip xz-utils

      - name: Install Theos
        run: |
          if [ ! -d "theos" ]; then
            git clone --recursive https://github.com/theos/theos.git theos
          fi
          echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV

      - name: Install Toolchain
        run: |
          if [ ! -f "$THEOS/toolchain/bin/clang" ]; then
            mkdir -p $THEOS/toolchain
            curl -L https://github.com/theos/toolchain/releases/latest/download/toolchain_linux_x86_64.tar.xz -o /tmp/toolchain.tar.xz
            tar -xJf /tmp/toolchain.tar.xz -C $THEOS/toolchain --strip-components=1
          fi
          echo "clang: $(ls $THEOS/toolchain/bin/clang 2>&1)"

      - name: Install iOS SDK
        run: |
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            mkdir -p $THEOS/sdks
            curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
            unzip -q /tmp/sdks.zip -d /tmp/sdks
            cp -r /tmp/sdks/sdks-master/* $THEOS/sdks/
          fi
          echo "sdk: $(ls $THEOS/sdks/ | head -3)"

      - name: Build package
        run: |
          cd wechat-ipad-login
          make clean || true
          make package FINAL=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChatIPadLogin-deb
          path: wechat-ipad-login/packages/*.deb
