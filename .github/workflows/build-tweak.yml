name: Build WeChat iPad Login Tweak

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}-${{ github.sha }}
          restore-keys: theos-${{ runner.os }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync curl perl

      - name: Install Theos
        run: |
          if [ ! -d "theos" ]; then
            git clone --recursive https://github.com/theos/theos.git theos
          fi
          echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV

      - name: Install iOS SDK
        run: |
          curl -L https://github.com/theos/sdks/archive/main.zip -o sdks.zip
          unzip -q sdks.zip -d theos/sdks
          rm sdks.zip

      - name: Build package
        run: |
          cd wechat-ipad-login
          make package FINAL=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChatIPadLogin
          path: wechat-ipad-login/packages/*.deb

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: wechat-ipad-login/packages/*.deb
