name: Build WeChat iPad Login Tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}
          restore-keys: theos-${{ runner.os }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git libxml2 libtinfo6 unzip xz-utils

      - name: Install Theos
        run: |
          if [ ! -d "theos/bin" ]; then
            git clone --recursive https://github.com/theos/theos.git theos
          fi
          echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV

      - name: Install Toolchain
        run: |
          if [ ! -f "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            mkdir -p $THEOS/toolchain/linux/iphone
            curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJf - -C $THEOS/toolchain/
          fi
          echo "clang: $($THEOS/toolchain/linux/iphone/bin/clang --version 2>&1 | head -1)"

      - name: Install iOS SDK
        run: |
          if [ ! -d "$THEOS/sdks/iPhoneOS"* ]; then
            mkdir -p $THEOS/sdks
            curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
            unzip -q /tmp/sdks.zip -d /tmp/sdks
            cp -r /tmp/sdks/sdks-master/* $THEOS/sdks/
          fi
          echo "sdk: $(ls $THEOS/sdks/ | grep iPhoneOS | head -1)"

      - name: Build package
        run: |
          cd wechat-ipad-login
          make clean || true
          make package FINAL=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChatIPadLogin-deb
          path: wechat-ipad-login/packages/*.deb
